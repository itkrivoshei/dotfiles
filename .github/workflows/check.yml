name: check

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt jq

      - name: ShellCheck scripts
        run: shellcheck scripts/*.sh

      - name: Check shell formatting
        run: shfmt -d scripts/*.sh home/.oh-my-zsh/custom/*.zsh

      - name: Validate JSON
        run: |
          jq . config/Code/User/settings.json >/dev/null
          jq . config/nvim/lazyvim.json >/dev/null
