name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt jq python3

      - name: Check Bash syntax
        run: |
          for file in scripts/*.sh; do
            bash -n "$file"
          done

      - name: ShellCheck scripts
        run: shellcheck scripts/*.sh

      - name: Check shell formatting
        run: shfmt -d scripts/*.sh home/.oh-my-zsh/custom/*.zsh

      - name: Validate JSON and JSONC
        run: |
          npx --yes json5@2.2.3 vscode/settings.json >/dev/null
          jq . config/nvim/lazyvim.json >/dev/null

      - name: Validate VS Code portability
        run: |
          test -s vscode/extensions.txt
          sort -f -c vscode/extensions.txt
          grep -nEv '^[A-Za-z0-9-]+\.[A-Za-z0-9-]+$' vscode/extensions.txt && exit 1 || true
          grep -nE '(/home/|/Users/)' vscode/settings.json && exit 1 || true

      - name: Validate TOML
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          for path in [Path('config/starship.toml'), Path('config/nvim/stylua.toml')]:
              with path.open('rb') as file:
                  tomllib.load(file)
          PY

      - name: Validate package manifest
        run: |
          test -s packages/ubuntu-apt.txt
          grep -nE '^\s*$' packages/ubuntu-apt.txt && exit 1 || true
