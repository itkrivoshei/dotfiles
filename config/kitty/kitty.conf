# ============================================================
# Kitty config — stable modern dev setup
# System: Ubuntu / GNOME
# Shell: zsh via default login shell
# Prompt: Starship
# Font: JetBrainsMono Nerd Font Mono
# Theme: Catppuccin Mocha
# ============================================================

font_family JetBrainsMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0
disable_ligatures never

# GNOME-friendly resizing.
resize_in_steps no
remember_window_size no
initial_window_width 120c
initial_window_height 34c
window_padding_width 8
placement_strategy center

cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 10.0

scrollback_lines 10000
wheel_scroll_multiplier 3.0

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{title}"
active_tab_title_template "{title}"

enabled_layouts splits,stack,tall,grid

confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0.0
mouse_hide_wait 3.0
copy_on_select no
strip_trailing_spaces smart

sync_to_monitor yes
repaint_delay 10
input_delay 3

open_url_with default
url_style curly

map ctrl+shift+enter launch --cwd=current
map ctrl+shift+t launch --type=tab --cwd=current
map ctrl+shift+n launch --type=os-window --cwd=current
map ctrl+shift+w close_window
map ctrl+shift+l next_layout
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+f5 load_config_file
map ctrl+shift+f2 edit_config_file
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+f search_scrollback

# Catppuccin Mocha colors
